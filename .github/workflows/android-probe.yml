name: Android Probe APK

on:
  push:
    branches:
      - android
    paths:
      - "android/**"
      - "src/android/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:

concurrency:
  group: bm64-android-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build SDL2 for Android ARM64
        shell: bash
        env:
          SDL_VERSION: release-2.32.10
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git /tmp/SDL2
          PREFIX="$HOME/Android/prefixes/SDL2-2.32.10-android-arm64"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S /tmp/SDL2 -B /tmp/SDL2-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF
          "$CMAKE" --build /tmp/SDL2-build --parallel
          "$CMAKE" --install /tmp/SDL2-build
          test -f "$PREFIX/lib/libSDL2.so"

      - name: Build ARM64 probe APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            -Pbm64Probe=true \
            --no-daemon \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/bm64-apk.txt
          grep -q "lib/arm64-v8a/libmain.so" /tmp/bm64-apk.txt
          grep -q "lib/arm64-v8a/libSDL2.so" /tmp/bm64-apk.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: BM64Recomp-Android-ARM64-Probe
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
