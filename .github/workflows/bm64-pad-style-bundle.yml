name: BM64 Pad Style Bundle

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/bm64-pad-style-bundle.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 1
          submodules: false
      - uses: actions/upload-artifact@v4
        with:
          name: bm64-pad-style-delta
          path: android/app/src/main/java/com/eightcee/bm64recomp/VirtualPadView.java
          if-no-files-found: error
