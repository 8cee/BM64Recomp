name: BM64 Diagnostics Source Bundle

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/bm64-diagnostics-source-bundle.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 1
          submodules: false

      - name: Upload diagnostics source delta
        uses: actions/upload-artifact@v4
        with:
          name: bm64-diagnostics-source-delta
          path: |
            android/app/src/main/java/com/eightcee/bm64recomp/BM64SDLActivity.java
            android/app/src/main/java/com/eightcee/bm64recomp/VirtualPadView.java
            android/app/src/main/java/com/eightcee/bm64recomp/DiagnosticsLogger.java
            android/app/src/main/java/com/eightcee/bm64recomp/DiagnosticsActivity.java
            android/app/src/main/java/com/eightcee/bm64recomp/DiagnosticsFilesProvider.java
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/res/values/strings.xml
            android/app/src/main/res/xml/shortcuts.xml
            include/recomp_input.h
            src/game/controls.cpp
            src/game/input.cpp
          if-no-files-found: error
