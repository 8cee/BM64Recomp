name: BM64 Offline Android Toolchain

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/bm64-offline-android-toolchain.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 1
          submodules: false

      - name: Initialize required submodules
        run: |
          set -euo pipefail
          git submodule update --init --recursive             BM64Syms             lib/N64ModernRuntime             lib/RmlUi             lib/freetype-windows-binaries             lib/lunasvg             lib/rt64             lib/sse2neon

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build unzip clang lld zstd

      - name: Build SDL2 for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          PREFIX="$HOME/Android/prefixes/SDL2-2.32.10-android-arm64"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S /tmp/SDL2 -B /tmp/SDL2-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$PREFIX"             -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          "$CMAKE" --build /tmp/SDL2-build --parallel
          "$CMAKE" --install /tmp/SDL2-build

      - name: Build Freetype for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch VER-2-13-3 https://gitlab.freedesktop.org/freetype/freetype.git /tmp/freetype
          PREFIX="$HOME/Android/prefixes/freetype-2.13.3-android-arm64"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S /tmp/freetype -B /tmp/freetype-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$PREFIX"             -DBUILD_SHARED_LIBS=OFF             -DFT_DISABLE_HARFBUZZ=TRUE -DFT_DISABLE_BZIP2=TRUE             -DFT_DISABLE_PNG=TRUE -DFT_DISABLE_BROTLI=TRUE
          "$CMAKE" --build /tmp/freetype-build --parallel
          "$CMAKE" --install /tmp/freetype-build

      - name: Warm Gradle dependencies
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:help -Pbm64Probe=true --no-daemon
          gradle :app:assembleDebug -Pbm64Probe=true --no-daemon

      - name: Build offline bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/bm64-offline/sdk /tmp/bm64-offline/home
          mkdir -p /tmp/bm64-offline/project
          tar -C "$GITHUB_WORKSPACE" \
            --exclude='.git' \
            --exclude='**/.git' \
            --exclude='android/.gradle' \
            --exclude='android/app/build' \
            --exclude='build' \
            -cf - . | tar -C /tmp/bm64-offline/project -xf -
          cp -a "$ANDROID_HOME/platforms" /tmp/bm64-offline/sdk/
          cp -a "$ANDROID_HOME/build-tools" /tmp/bm64-offline/sdk/
          cp -a "$ANDROID_HOME/ndk" /tmp/bm64-offline/sdk/
          cp -a "$ANDROID_HOME/cmake" /tmp/bm64-offline/sdk/
          cp -a "$HOME/Android" /tmp/bm64-offline/home/
          cp -a "$HOME/.gradle" /tmp/bm64-offline/home/
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"
          mkdir -p /tmp/bm64-offline/gradle
          cp -a "$GRADLE_ROOT" /tmp/bm64-offline/gradle/8.11.1
          printf '%s\n' \
            'ANDROID_HOME_REL=sdk' \
            'GRADLE_REL=gradle/8.11.1' \
            'PROJECT_REL=project' \
            'HOME_ANDROID_REL=home/Android' \
            'HOME_GRADLE_REL=home/.gradle' \
            > /tmp/bm64-offline/ENV.txt
          tar -C /tmp -I 'zstd -T0 -1' -cf /tmp/bm64-offline-android-toolchain.tar.zst bm64-offline
          ls -lh /tmp/bm64-offline-android-toolchain.tar.zst

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: bm64-offline-android-toolchain
          path: /tmp/bm64-offline-android-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
