name: BM64 Offline Transfer Chunks

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/bm64-offline-transfer-chunks.yml'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 1
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build unzip clang lld

      - name: Build SDL2 for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git /tmp/SDL2
          PREFIX="$HOME/Android/prefixes/SDL2-2.32.10-android-arm64"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S /tmp/SDL2 -B /tmp/SDL2-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$PREFIX"             -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          "$CMAKE" --build /tmp/SDL2-build --parallel
          "$CMAKE" --install /tmp/SDL2-build

      - name: Build Freetype for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 --branch VER-2-13-3 https://gitlab.freedesktop.org/freetype/freetype.git /tmp/freetype
          PREFIX="$HOME/Android/prefixes/freetype-2.13.3-android-arm64"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S /tmp/freetype -B /tmp/freetype-build -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$PREFIX"             -DBUILD_SHARED_LIBS=OFF             -DFT_DISABLE_HARFBUZZ=TRUE -DFT_DISABLE_BZIP2=TRUE             -DFT_DISABLE_PNG=TRUE -DFT_DISABLE_BROTLI=TRUE
          "$CMAKE" --build /tmp/freetype-build --parallel
          "$CMAKE" --install /tmp/freetype-build

      - name: Warm Gradle dependencies
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:help -Pbm64Probe=true --no-daemon
          gradle :app:assembleDebug -Pbm64Probe=true --no-daemon

      - name: Stage transferable files
        run: |
          set -euo pipefail
          mkdir -p /tmp/xfer/platform /tmp/xfer/build-tools /tmp/xfer/cmake /tmp/xfer/gradle-dist /tmp/xfer/prefixes
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/xfer/platform/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" /tmp/xfer/build-tools/
          cp -a "$ANDROID_HOME/cmake/3.22.1" /tmp/xfer/cmake/
          cp -a "$HOME/Android/prefixes/." /tmp/xfer/prefixes/
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(dirname "$(dirname "$GRADLE_BIN")")"
          cp -a "$GRADLE_ROOT/." /tmp/xfer/gradle-dist/
          tar -C "$ANDROID_HOME/ndk" -cf /tmp/ndk.tar 28.2.13676358
          split -b 400M -d -a 2 /tmp/ndk.tar /tmp/ndk-part-
          tar -C "$HOME" -cf /tmp/gradle-cache.tar .gradle
          split -b 400M -d -a 2 /tmp/gradle-cache.tar /tmp/gradle-cache-part-
          ls -lh /tmp/ndk-part-* /tmp/gradle-cache-part-*

      - name: Upload platform
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-platform
          path: /tmp/xfer/platform
          compression-level: 0

      - name: Upload build tools
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-build-tools
          path: /tmp/xfer/build-tools
          compression-level: 0

      - name: Upload CMake
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-cmake
          path: /tmp/xfer/cmake
          compression-level: 0

      - name: Upload Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-gradle-dist
          path: /tmp/xfer/gradle-dist
          compression-level: 0

      - name: Upload prefixes
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-prefixes
          path: /tmp/xfer/prefixes
          compression-level: 0

      - name: Upload NDK 00
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-00
          path: /tmp/ndk-part-00
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 01
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-01
          path: /tmp/ndk-part-01
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 02
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-02
          path: /tmp/ndk-part-02
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 03
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-03
          path: /tmp/ndk-part-03
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 04
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-04
          path: /tmp/ndk-part-04
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 05
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-05
          path: /tmp/ndk-part-05
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 06
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-06
          path: /tmp/ndk-part-06
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 07
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-07
          path: /tmp/ndk-part-07
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 08
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-08
          path: /tmp/ndk-part-08
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload NDK 09
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-ndk-09
          path: /tmp/ndk-part-09
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload Gradle cache 00
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-gradle-cache-00
          path: /tmp/gradle-cache-part-00
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload Gradle cache 01
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-gradle-cache-01
          path: /tmp/gradle-cache-part-01
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload Gradle cache 02
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-gradle-cache-02
          path: /tmp/gradle-cache-part-02
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload Gradle cache 03
        uses: actions/upload-artifact@v4
        with:
          name: bm64-xfer-gradle-cache-03
          path: /tmp/gradle-cache-part-03
          compression-level: 0
          if-no-files-found: ignore
